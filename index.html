    <script>
      // Safeguard against iframe/sandbox environments where window.fetch has only a getter
      (function () {
        try {
          var targetObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : null);
          if (!targetObj) return;

          var nativeFetch = targetObj.fetch;
          var activeFetch = typeof nativeFetch === 'function' ? function () {
            return nativeFetch.apply(targetObj, arguments);
          } : nativeFetch;

          try {
            Object.defineProperty(targetObj, 'fetch', {
              get: function () {
                return activeFetch;
              },
              set: function (newFn) {
                activeFetch = newFn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return activeFetch;
                  },
                  set: function (newFn) {
                    activeFetch = newFn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
